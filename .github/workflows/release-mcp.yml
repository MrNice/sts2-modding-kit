# Publishes sts2-mcp to nuget.org with Trusted Publishing (GitHub OIDC; no stored API key).
# Runs when a tag like mcp-v0.1.0 is pushed. The tag's version must match <Version> in bridge/Sts2Mcp/Sts2Mcp.csproj.
# The nuget.org policy is tied to this file name (release-mcp.yml): don't rename it.
name: release-mcp

on:
  push:
    tags: ["mcp-v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Check the tag matches the project version
        run: |
          tag="${GITHUB_REF_NAME#mcp-v}"
          version=$(grep -oP '(?<=<Version>)[^<]+' bridge/Sts2Mcp/Sts2Mcp.csproj)
          echo "tag $tag, project $version"
          test "$tag" = "$version"

      - name: Test
        run: dotnet test bridge/tests/Sts2Mcp.Tests -c Release

      - name: Pack
        run: dotnet pack bridge/Sts2Mcp -c Release -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: artifacts

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      # Exchanges the workflow's OIDC token for a short-lived nuget.org key (valid about an hour).
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        run: dotnet nuget push artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
